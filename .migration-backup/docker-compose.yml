services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forgefolio
      POSTGRES_USER: forgefolio
      POSTGRES_PASSWORD: forgefolio
    ports:
      - "5432:5432"
    volumes:
      - forgefolio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgefolio -d forgefolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - forgefolio-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  forgefolio-postgres:
  forgefolio-redis:
