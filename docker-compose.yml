services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skillpath
      POSTGRES_USER: skillpath
      POSTGRES_PASSWORD: skillpath
    ports:
      - "5432:5432"
    volumes:
      - skillpath-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillpath -d skillpath"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - skillpath-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  skillpath-postgres:
  skillpath-redis:
